<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Apps Script Iframe</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container jo iframe ko rakhega */
        .iframe-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Desktop View (Default) */
        .iframe-container.desktop-view {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        /* Mobile View (jab toggle on ho) */
        .iframe-container.mobile-view {
            width: 390px;
            height: 844px;
            border-radius: 40px;
            border: 12px solid #2d3748;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Mobile View ke andar border-radius adjust karne ke liye */
        .iframe-container.mobile-view iframe {
            border-radius: 28px;
        }

        /* Floating Toggle Button */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            outline: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 1000;
        }

        .floating-btn:hover {
            transform: scale(1.08);
            background: #4338ca;
        }

        .floating-btn:active {
            transform: scale(0.95);
        }

        /* Tooltip style */
        .floating-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            right: 75px;
            background: #1f2937;
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .floating-btn:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Iframe Container (Bydefault Desktop View) -->
    <div class="iframe-container desktop-view" id="viewContainer">
        <iframe src="https://script.google.com/macros/s/AKfycbyYRPGa8Ab9mfK_OQn31Drl_1S-lFScCNdWxmlE7MlvSSrr_YXLs5EhtDNKuAbfrRpl/exec" title="Apps Script Web App"></iframe>
    </div>

    <!-- Floating Mobile/Desktop Toggle Button -->
    <button class="floating-btn" id="toggleBtn" onclick="toggleView()" data-tooltip="Switch to Mobile View">
        <i class="fa-solid fa-mobile-screen" id="btnIcon"></i>
    </button>

    <script>
        function toggleView() {
            const container = document.getElementById('viewContainer');
            const btn = document.getElementById('toggleBtn');
            const icon = document.getElementById('btnIcon');

            if (container.classList.contains('desktop-view')) {
                // Switch to Mobile View
                container.classList.remove('desktop-view');
                container.classList.add('mobile-view');
                icon.className = "fa-solid fa-desktop";
                btn.setAttribute('data-tooltip', 'Switch to Desktop View');
            } else {
                // Switch back to Desktop View
                container.classList.remove('mobile-view');
                container.classList.add('desktop-view');
                icon.className = "fa-solid fa-mobile-screen";
                btn.setAttribute('data-tooltip', 'Switch to Mobile View');
            }
        }
    </script>

</body>
</html>
